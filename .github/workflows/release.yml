name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test
        run: python tests/smoke_test.py

      - name: Build GroupSplitter.exe
        run: |
          python -m PyInstaller --name GroupSplitter --windowed --onefile --paths . app/main.py

      - name: Stage release asset
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:GITHUB_REF_NAME
          } else {
            "dev-$($env:GITHUB_SHA.Substring(0, 7))"
          }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\GroupSplitter.exe "release\GroupSplitter-$version-windows.exe"
          Copy-Item dist\GroupSplitter.exe release\GroupSplitter.exe
          Write-Output "VERSION=$version" >> $env:GITHUB_ENV

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: GroupSplitter-${{ env.VERSION }}-windows
          path: |
            release/GroupSplitter.exe
            release/GroupSplitter-${{ env.VERSION }}-windows.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: GroupSplitter ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/GroupSplitter.exe
            release/GroupSplitter-${{ github.ref_name }}-windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
